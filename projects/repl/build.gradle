plugins {
    id 'java-library'
}

description = "MiniConnect REPL"

tasks.withType(JavaCompile).configureEach {
    options.release = 8
}

dependencies {
    implementation 'hu.webarticum:regexbee:0.4.1'

    api "hu.webarticum.miniconnect.api:api:${miniConnectApiVersion}"
    api 'org.jline:jline:3.30.6'
}
